# dsh.bundle manifest 指向的本插件补丁。
# name 必须与 package.json 的 name 一致(DSH 按包名解析入口);id 为该插件在宿主中的实例标识。
# 安装方式:
#   dsh plugin add dsh-aquasense        # npm 已发布后
#   dsh plugin add .                    # 仓库本地开发
# 顶层必须是 loader patch 条目数组(每个条目形如 { insert: [...] })
- insert:
    - id: aquasense
      name: dsh-aquasense
      config: {}
